<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Algoritmos SO</title>
    
    <link rel="icon" type="image/png" href="./src/assets/perfil_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Fondo animado para el efecto cristal -->
    <div class="glass-bg">
        <div class="blob blob-celeste"></div>
        <div class="blob blob-plomo"></div>
        <div class="blob blob-blanco"></div>
    </div>

    <header class="topbar glass-panel">
        <div class="header-brand">
            <h1 class="header-title">SO <span>Simulador</span></h1>
            <span class="header-subtitle">Planificación de Procesos</span>
        </div>
        
        <div class="header-actions">
            <!-- ✨ SELECTOR DE ALGORITMO PREMIUM ✨ -->
            <div class="custom-select-wrapper">
                <label for="algoritmo">Algoritmo:</label>
                <div class="select-box">
                    <select id="algoritmo" class="select-clean">
                        <option value="FCFS">FCFS (First-Come, First-Served)</option>
                        <option value="SJF">SJF (Shortest Job First)</option>
                        <option value="RR">Round Robin</option>
                        <option value="PR">Prioridades (No apropiativo)</option>
                        <option value="MLQ">Colas Múltiples (MLFQ)</option>
                    </select>
                    <!-- Flecha SVG que gira -->
                    <svg class="select-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
            </div>
            
            <button id="btn-toggle" class="btn-expandir" title="Ampliar Vista">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                </svg>
                <span>Vista Full</span>
            </button>
        </div>
    </header>

    <main class="layout-main">
        <aside class="sidebar">
            <div class="card-panel glass-panel">
                <div class="form-row">
                    <label for="num-procesos">Procesos</label>
                    <input type="number" id="num-procesos" value="5" min="1" max="15" class="input-clean">
                </div>
                
                <div class="form-row">
                    <label for="ctxt">Cambio de Contexto</label>
                    <input type="number" id="ctxt" value="2" min="0" class="input-clean">
                </div>
            </div>

            <div class="card-panel glass-panel panel-tabla">
                <table id="tabla-entradas">
                    <thead>
                        <tr>
                            <th>Proc</th>
                            <th>Tej</th>
                            <th>Tlleg</th>
                            <th class="col-prio" style="display: none;">Prio</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Generado dinámicamente -->
                    </tbody>
                </table>
            </div>

            <div class="card-panel glass-panel" id="panel-dinamico">
                <div class="form-group" id="contenedor-quantum" style="display: none;">
                    <label for="quantum">Quantum General (Q)</label>
                    <input type="number" id="quantum" value="2" min="1" class="input-clean">
                </div>
                
                <div id="contenedor-mlq" style="display: none;">
                    <div class="form-row">
                        <label for="num-colas-mlq" class="label-highlight">N° Colas (MLQ)</label>
                        <input type="number" id="num-colas-mlq" value="3" min="2" max="6" class="input-clean">
                    </div>
                    <div class="divider"></div>
                    <label class="label-small">Asignación de Quantums</label>
                    <div id="mlq-quantums-container" class="mlq-grid">
                        <!-- Generado dinámicamente -->
                    </div>
                </div>
            </div>

            <div class="card-panel glass-panel debug-panel">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="modo-debug">
                    <span class="checkbox-custom"></span>
                    <span class="checkbox-label">Modo Paso a Paso</span>
                </label>
            </div>
            
            <button id="btn-simular" class="btn-primary glass-btn">
                Ejecutar Simulación
            </button>
        </aside>

        <section class="content-area">
            <div class="card-result glass-panel">
                <div class="result-header">
                    <h3>Diagrama de Gantt</h3>
                    <div id="controles-debug" class="debug-controls" style="display: none;">
                        <button id="btn-retroceder-paso" class="btn-secondary">Retroceder</button>
                        <button id="btn-siguiente-paso" class="btn-primary-small">Siguiente</button>
                    </div>
                </div>
                
                <div id="consola-debug" class="console-box glass-inset" style="display: none;">
                    > Esperando inicio...
                </div>

                <div id="gantt-container" class="gantt-wrapper">
                    <div class="empty-state">
                        <p>Los resultados del diagrama aparecerán aquí.</p>
                    </div>
                </div>
            </div>

            <div class="card-result glass-panel">
                <h3>Estadísticas</h3>
                <div class="tabla-stats-wrapper">
                    <table id="tabla-estadisticas" class="table-stats">
                        <thead>
                            <tr>
                                <th>Proceso</th>
                                <th>T. Retorno (Tret)</th>
                                <th>T. Espera (Tesp)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Generado dinámicamente -->
                        </tbody>
                        <tfoot>
                            <tr class="tfoot-promedios">
                                <th>Promedios Globales</th>
                                <th id="promedio-tret">0.00</th>
                                <th id="promedio-tesp">0.00</th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <footer class="marca-personal">
        <p>&copy; <strong>Edgar Perez</strong> | <span class="marca-brillante">ANDRADE CRAFT</span> Systems</p>
    </footer>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
